<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="顧客管理">
<meta name="theme-color" content="#1c1c1f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Andz 顧客管理</title>
<style>
/* Layout: phone-first app shell — header / scrolling body / bottom tab bar, mirroring the salon's existing dark app */
:root{
  --bg:#111113; --surface:#1c1c1f; --card:#28282c; --card2:#212124; --line:#36363b;
  --fg:#f3f3f5; --muted:#9c9ca4; --accent:#d62f58; --accent-soft:rgba(214,47,88,.2);
  --pill:#46a594; --gold:#d1aa3f; --gold-soft:rgba(209,170,63,.2); --green:#5aa35d; --green-soft:rgba(90,163,93,.2);
  --orange:#dc8c2c; --orange-soft:rgba(220,140,44,.2); --sun:#f0585a; --sat:#5aa2ff; --overlay:rgba(0,0,0,.6);
  --font:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
  color-scheme:dark;
  --sat-top:0px;--sat-bottom:0px;
}
@media (display-mode: standalone){:root{--sat-top:env(safe-area-inset-top,0px);--sat-bottom:env(safe-area-inset-bottom,0px)}}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
button,a,label,input,select{touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto}
header#hdr{display:flex;align-items:center;gap:12px;padding:calc(12px + var(--sat-top)) 16px 12px;background:var(--surface);border-bottom:1px solid var(--line);min-height:64px}
header h1{flex:1;margin:0;font-size:19px;font-weight:700;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mnav{display:flex;align-items:center;border:2px solid var(--fg);border-radius:999px;padding:2px}
.mnav button{padding:6px 10px;font-weight:600;font-size:14px;border-radius:999px}
.mnav button:active{background:var(--card)}
.iconbtn{width:42px;height:42px;border-radius:50%;background:var(--card);display:grid;place-items:center;flex:none;font-size:24px;line-height:1}
.iconbtn svg{width:22px;height:22px}
.spacer{width:42px;flex:none}
#banner{padding:10px 16px;background:var(--gold-soft);color:var(--fg);font-size:13px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#banner b{color:var(--gold)}
#banner .bb{margin-left:auto;display:flex;gap:6px}
#main{flex:1;min-height:0;overscroll-behavior:contain;overflow-y:auto;overflow-x:hidden;padding:12px 16px 24px;-webkit-overflow-scrolling:touch}
#actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 16px;background:var(--bg);border-top:1px solid var(--line)}
nav#tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:6px 8px calc(8px + var(--sat-bottom));background:var(--surface);border-top:1px solid var(--line)}
nav#tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:999px;font-size:11px;font-weight:600;color:var(--fg)}
nav#tabs button svg{width:28px;height:28px}
nav#tabs button[aria-current="page"]{background:var(--card);color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 14px;border-radius:12px;background:var(--card);font-weight:600;font-size:15px}
.btn.primary{background:var(--accent);color:#fff}
.btn.outline{border:1.5px solid var(--accent);color:var(--accent);background:transparent}
.btn.danger{background:transparent;color:var(--sun);border:1px solid var(--line)}
.btn.sm{padding:7px 10px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45}
.seg{display:flex;background:var(--card2);border-radius:999px;padding:3px;gap:2px}
.seg button{flex:1;padding:8px 6px;border-radius:999px;font-size:14px;font-weight:600;white-space:nowrap}
.seg button[aria-pressed="true"]{background:#5a5a60;color:#fff}
.muted{color:var(--muted)}
.pill{display:inline-block;max-width:100%;background:var(--pill);color:#fff;border-radius:7px;padding:5px 8px;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.sumline{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:4px 0 8px}
.sumline strong{font-size:20px}
.chart{background:var(--surface);border-radius:14px;padding:10px 6px 4px;margin-bottom:12px}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:2px 10px 6px}
.legend i{width:10px;height:10px;background:var(--accent);display:inline-block}
/* visit grid */
.vgrid{border-top:1px solid var(--line)}
.vhead,.vrow{display:grid;grid-template-columns:5.4rem 4.4rem 4.6rem 2.2rem minmax(0,1fr);gap:1px;align-items:center}
.vhead{background:var(--accent);color:#fff;font-size:11px;white-space:nowrap;font-weight:700;position:sticky;top:-12px;z-index:1}
.vhead span{padding:8px 4px;text-align:center}
.vhead span:last-child{text-align:left}
.vrow{background:var(--line);border-bottom:1px solid var(--line);cursor:pointer}
.vrow>span{background:var(--card2);padding:7px 4px;font-size:12.5px;text-align:center;height:100%;display:flex;align-items:center;justify-content:center;min-width:0}
.vrow>span:last-child{justify-content:flex-start;padding-left:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;line-height:2}
.vrow .pill{width:100%;font-size:12px;padding:4px 4px}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;padding:14px 4px 6px;font-size:17px;font-weight:600}
.dayhead small{font-size:12px;color:var(--muted);font-weight:500}
.star{display:inline-grid;place-items:center;width:24px;height:24px;font-size:10.5px;font-weight:700;color:#222;position:relative}
.star svg{position:absolute;inset:0;width:24px;height:24px}
.star b{position:relative;margin-top:2px}
.empty{background:var(--surface);border-radius:16px;padding:28px 20px;text-align:center;display:grid;gap:12px;justify-items:center}
.empty h2{margin:0;font-size:18px}
.empty p{margin:0;color:var(--muted);font-size:14px;line-height:1.7;max-width:34em}
.empty .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
/* customers */
.filters{display:grid;gap:10px;margin-bottom:12px}
.search{display:flex;gap:8px;align-items:center}
.search input{flex:1;min-width:0;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:12px 16px;color:var(--fg);font-size:16px}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chips .btn{padding:10px 4px;font-size:13.5px}
.ctable{border-top:1px solid var(--line)}
.chead,.crow{display:grid;grid-template-columns:minmax(0,1.25fr) 1.15fr .75fr 1fr;gap:1px}
.chead{background:var(--accent);position:sticky;top:-12px;z-index:1}
.chead button{padding:9px 2px;font-size:12px;font-weight:700;color:#fff}
.crow{background:var(--line);border-bottom:1px solid var(--line);cursor:pointer}
.crow>span{background:var(--card2);padding:7px 4px;font-size:13px;display:flex;align-items:center;justify-content:center;min-width:0}
.crow .pill{width:100%;padding:9px 4px}
.more{display:block;margin:12px auto 0}
/* calendar */
.calbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;margin-bottom:10px}
.calbar .tot{font-size:13px;line-height:1.4}
.calbar .tot b{font-size:16px}
.calbar .seg{flex:1 1 260px}
.calbar .seg button{font-size:13px;padding:7px 4px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.cal .wd{text-align:center;font-size:12px;padding:6px 0;background:var(--surface);color:var(--muted)}
.cal .cell{background:var(--surface);min-height:84px;padding:3px 2px 4px;display:flex;flex-direction:column;gap:2px;cursor:pointer;min-width:0}
.cal .cell.out{background:var(--bg);opacity:.55}
.cal .cell.today{outline:1.5px solid var(--accent);outline-offset:-1.5px}
.cal .dn{display:flex;justify-content:center;align-items:baseline;gap:3px;font-size:14px}
.cal .dn small{font-size:9.5px;color:var(--muted)}
.cal .sun{color:var(--sun)} .cal .sat{color:var(--sat)}
.cal .cp{background:var(--pill);color:#fff;border-radius:6px;padding:2px 2px;font-size:var(--cfs,10px);line-height:1.25;text-align:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.calfoot{display:flex;justify-content:flex-end;margin-top:10px}
.calfoot .seg{width:220px}
/* summary table */
.tblwrap{overflow-x:auto;margin-top:12px}
table.sum{width:100%;border-collapse:collapse;font-size:12.5px;min-width:360px}
table.sum th{background:var(--accent);color:#fff;padding:9px 4px;font-weight:700;border:1px solid var(--bg)}
table.sum td{background:var(--card2);padding:7px 4px;text-align:center;border:1px solid var(--bg);white-space:nowrap}
table.sum td small{display:block;font-size:10px;color:var(--muted)}
table.sum tr.total td{background:var(--card);font-weight:700}
/* analysis */
.period{background:var(--card);border-radius:22px;padding:16px;display:grid;gap:10px;justify-items:center;margin-bottom:20px}
.period .pnav{display:flex;align-items:center;gap:4px;background:var(--accent-soft);border-radius:999px;padding:4px}
.period .pnav button{padding:6px 10px;border-radius:999px}
.period .pnav span{font-weight:600;padding:0 4px}
.period .nums{display:grid;grid-template-columns:1fr 1px 1fr;width:100%;align-items:center;text-align:center}
.period .nums i{background:var(--line);height:70%}
.big{font-size:38px;font-weight:800;line-height:1.1}
.big.red{color:var(--accent)} .big.gold{color:var(--gold)}
.sec{display:flex;align-items:center;gap:10px;margin:8px 0 12px;color:var(--muted);font-weight:700;font-size:16px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.sec svg{width:24px;height:24px;color:var(--accent)}
.acards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px}
.acard{background:var(--card);border-radius:20px;padding:14px 14px 10px;text-align:left;display:grid;gap:4px;min-height:150px;align-content:start}
.acard .ic{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;margin-bottom:22px}
.acard .ic svg{width:26px;height:26px}
.acard b{font-size:15px}
.acard small{color:var(--muted);font-size:12px}
.acard .arr{justify-self:end;font-size:18px}
.rank{display:grid;gap:6px}
.rrow{display:grid;grid-template-columns:2em minmax(0,1fr) auto auto;gap:10px;align-items:center;background:var(--card2);border-radius:10px;padding:8px 10px;cursor:pointer}
.rrow .no{font-weight:800;color:var(--muted);text-align:center}
.rrow:nth-child(1) .no{color:var(--gold)}
.rrow .pill{justify-self:start}
.rrow .v{font-weight:600;white-space:nowrap}
.rrow .c{color:var(--muted);font-size:12px;white-space:nowrap}
/* bars */
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:2.2em minmax(0,1fr) auto;gap:10px;align-items:center}
.bar .t{height:22px;background:var(--card2);border-radius:6px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--accent);border-radius:6px}
.bar .lab{font-weight:700;text-align:center}
.bar .val{font-size:12.5px;color:var(--muted);white-space:nowrap;text-align:right}
/* sheets */
.sheet{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.panel{background:var(--surface);width:100%;max-width:640px;max-height:calc(100% - var(--sat-top) - 8px);border-radius:18px 18px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}}
.phead{display:grid;grid-template-columns:5em 1fr 5em;align-items:center;padding:12px 12px;border-bottom:1px solid var(--line)}
.phead h2{margin:0;font-size:16px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phead .x{color:var(--accent);font-weight:600;justify-self:start;padding:6px}
.pbody{overflow-y:auto;overscroll-behavior:contain;padding:16px;display:grid;gap:14px;align-content:start}
.field{display:grid;gap:6px}
.field>span{font-size:12.5px;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--fg);font-size:16px;font-family:inherit}
.field textarea{min-height:90px;resize:vertical;line-height:1.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sugg{display:grid;gap:4px}
.sugg button{text-align:left;padding:8px 10px;border-radius:8px;background:var(--card2);display:flex;justify-content:space-between;gap:8px}
.sugg button small{color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted);line-height:1.6}
.hint.warn{color:var(--gold)}
.stars{display:flex;gap:4px}
.stars button{width:38px;height:38px;border-radius:8px;background:var(--card2);font-size:20px;color:var(--muted)}
.stars button.on{color:var(--gold)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btnrow .btn{flex:1}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile{background:var(--card2);border-radius:12px;padding:10px 12px}
.tile small{display:block;color:var(--muted);font-size:11.5px}
.tile b{font-size:18px}
dl.info{margin:0;display:grid;grid-template-columns:6em minmax(0,1fr);gap:8px 12px;font-size:14px}
dl.info dt{color:var(--muted)}
dl.info dd{margin:0;white-space:pre-wrap;word-break:break-word;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hist{display:grid;gap:6px}
.hrow{background:var(--card2);border-radius:10px;padding:9px 12px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;cursor:pointer}
.hrow .d{font-weight:600}
.hrow .a{font-weight:700;color:var(--gold)}
.hrow .m{grid-column:1/-1;color:var(--muted);font-size:12.5px;white-space:pre-wrap;word-break:break-word}
.hrow .s{color:var(--muted);font-size:12.5px}
h3{margin:4px 0 0;font-size:15px}
.confirm{background:var(--accent-soft);border-radius:12px;padding:12px;display:grid;gap:10px}
.maplist{display:grid;gap:8px}
.mapitem{background:var(--card2);border-radius:12px;padding:10px 12px;display:grid;gap:6px}
.mapitem .h{font-weight:700}
.mapitem .ex{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mapitem select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px;color:var(--fg);font-size:15px}
.drop{border:2px dashed var(--line);border-radius:14px;padding:22px 14px;text-align:center;display:grid;gap:8px;justify-items:center}
.result{display:grid;gap:6px;background:var(--card2);border-radius:12px;padding:14px}
.result div{display:flex;justify-content:space-between}
textarea.out{width:100%;min-height:200px;background:var(--card2);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px}
.pbody.vform{padding:0 0 20px;gap:0}
.lgroup{background:var(--surface);margin-top:14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.vform .lgroup:first-child{margin-top:0;border-top:0}
.lrow{display:grid;grid-template-columns:auto minmax(0,1fr) 14px;align-items:center;gap:10px;width:100%;min-height:56px;padding:6px 12px 6px 16px;border-bottom:1px solid var(--line);text-align:left;font-size:16px;background:var(--card2)}
.lgroup>.lrow:last-child{border-bottom:0}
.lrow:not(button){grid-template-columns:auto minmax(0,1fr)}
.lrow .rv{display:flex;justify-content:flex-end;align-items:center;gap:6px;min-width:0;text-align:right}
.lrow .rv .pill{font-size:15px;padding:6px 16px;border-radius:10px}
.lrow .chev{color:var(--muted);font-size:24px;line-height:1}
.lrow:disabled{opacity:.5}
.lrow input{background:transparent;border:0;color:var(--fg);font:inherit;font-size:16px;text-align:right;min-width:0;width:100%;padding:6px 0}
.lrow input[type=date]{width:auto;max-width:9.5em}.lrow input[type=time]{width:auto;max-width:6.2em}
.lrow input::placeholder{color:var(--muted)}
.picker{padding:10px 12px;display:grid;gap:8px;background:var(--surface);border-bottom:1px solid var(--line)}
.picker input{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--fg);font-size:16px}
.qt{display:flex;justify-content:flex-end;align-items:center;gap:12px;padding:16px 12px 0;color:var(--muted);font-size:15px}
.sw{appearance:none;-webkit-appearance:none;width:58px;height:34px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;background:#fff;transition:transform .15s}
.sw:checked{background:var(--pill)}.sw:checked::after{transform:translateX(24px)}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.quick button{padding:9px 4px;border-radius:9px;background:var(--card);font-weight:600;font-size:14px}
.quick button.on{background:var(--pill);color:#fff}
.rate{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:12px;padding:18px 12px 6px 16px}
.bigstars{display:flex;justify-content:space-between;gap:4px}
.bigstars button{width:48px;height:48px;display:grid;place-items:center}
.bigstars svg{width:44px;height:44px;fill:#d6d6dc}
.bigstars button.on svg{fill:var(--gold)}
.mlabel{color:var(--muted);padding:22px 16px 8px}
textarea.memo{width:100%;min-height:140px;background:var(--card2);border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--fg);font:inherit;font-size:16px;line-height:1.6;padding:14px 16px;resize:vertical;margin-bottom:16px}
textarea.memo::placeholder{color:var(--muted)}
.vform .hint{padding:0 16px}
.phead .pr{justify-self:end}
.photos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:0 16px}
.vform .photos{padding:0 16px 4px}
.ph{position:relative;display:block;aspect-ratio:1;border-radius:9px;overflow:hidden;background:var(--card)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph small{position:absolute;left:0;right:0;bottom:0;font-size:10px;padding:2px 4px;background:rgba(0,0,0,.55);color:#fff;text-align:left}
.ph.missing::after{content:"なし";position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:11px}
.photos.gal{padding:0}
.addph{aspect-ratio:1;border:1.5px dashed var(--line);border-radius:9px;display:grid;place-items:center;align-content:center;gap:4px;color:var(--muted);font-size:11px;cursor:pointer;text-align:center}
.addph svg{width:28px;height:28px;color:var(--fg)}
.pmark svg{width:13px;height:13px;vertical-align:-2px;margin-right:4px;color:var(--muted)}
.pmark{font-style:normal}
svg.ic{width:13px;height:13px;vertical-align:-2px}
.viewer{position:fixed;inset:0;background:#000;z-index:35;display:flex;flex-direction:column;padding:var(--sat-top) 0 var(--sat-bottom)}
.vtop{display:grid;grid-template-columns:5em 1fr 5em;align-items:center;padding:10px 12px;color:#fff;font-size:14px;text-align:center}
.vtop button{color:#fff;font-weight:600;padding:6px}.vtop .vdel{color:var(--sun);justify-self:end}.vtop .vx{justify-self:start}
.vimg{flex:1;min-height:0;display:grid;place-items:center}
.vimg img{max-width:100%;max-height:100%;object-fit:contain}
.vnav{position:absolute;inset:50% 0 auto 0;display:flex;justify-content:space-between;pointer-events:none;padding:0 6px}
.vnav button{pointer-events:auto;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;font-size:26px}
.vconfirm{position:absolute;left:12px;right:12px;bottom:calc(16px + var(--sat-bottom));background:var(--surface);border-radius:12px;padding:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--fg)}
.vconfirm span{flex:1 1 100%}
.chead .nh{display:flex;background:var(--accent)}
.chead .nh button{flex:1;padding:9px 2px}
.chead .nh button:first-child{flex:0 0 3.4em;border-right:1px solid rgba(255,255,255,.25)}
.crow .nc{flex-direction:column;gap:3px}
.cno{font-size:10.5px;color:var(--muted);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.sugg .cno{margin-right:4px}
.noline{display:flex;align-items:baseline;gap:10px;color:var(--muted);font-size:13px}
.noline b{color:var(--fg);font-size:20px;letter-spacing:.08em;font-variant-numeric:tabular-nums}
.lock{position:fixed;inset:0;background:var(--bg);z-index:60;display:grid;place-items:center;padding:calc(20px + var(--sat-top)) 16px calc(20px + var(--sat-bottom))}
.lk-in{display:grid;justify-items:center;gap:14px;width:100%;max-width:320px}
.lk-in h2{margin:0;font-size:18px}
.lk-icon img{width:64px;height:64px;border-radius:15px}
.lk-msg{min-height:2.8em;margin:0;color:var(--gold);font-size:13px;text-align:center;line-height:1.5}
.dots{display:flex;gap:16px;justify-content:center;padding:6px 0}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--fg)}
.dots i.on{background:var(--fg)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:16px 24px;justify-content:center}
.pad button{width:72px;height:72px;border-radius:50%;background:var(--card);font-size:28px;font-weight:500}
.pad button.sm{background:transparent;font-size:14px;color:var(--muted)}
.pad button:active{background:var(--line)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-10px)}50%{transform:translateX(10px)}75%{transform:translateX(-6px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
#cloudchip{position:fixed;top:calc(8px + var(--sat-top));left:12px;background:var(--card);color:var(--muted);font-size:11px;padding:4px 10px;border-radius:999px;z-index:30}
#cloudchip.warn{color:var(--gold)}
.cloudbox{background:var(--card2);border-radius:12px;padding:12px;display:grid;gap:6px;font-size:13px}
.cloudbox span{color:var(--muted);line-height:1.6}
.login .field{width:100%}
.login .btn.sm{background:transparent;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#f3f3f5;color:#111;padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:40;max-width:calc(100% - 32px);text-align:center}
#savechip{position:fixed;top:calc(8px + var(--sat-top));right:12px;background:var(--card);color:var(--muted);font-size:11px;padding:4px 10px;border-radius:999px;z-index:30}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
</style>

<script>
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const yen=n=>(Math.round(n)||0).toLocaleString('ja-JP')+'円';
const WD='日月火水木金土';
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const dstr=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayStr=()=>dstr(new Date());
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const fmtD=s=>s?s.replace(/^(\d+)-0?(\d+)-0?(\d+)$/,'$1/$2/$3'):'';
const wdOf=s=>WD[parseD(s).getDay()];
const fmtDur=m=>`${Math.floor((m||0)/60)}時間${pad((m||0)%60)}分`;
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const norm=s=>String(s??'').normalize('NFKC').replace(/\s+/g,' ').trim();
const nameKey=s=>norm(s).replace(/\s/g,'').toLowerCase();
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)}
const daysSince=s=>Math.floor((parseD(todayStr())-parseD(s))/864e5);
const capCache={};
const cap=n=>capCache[n]||(capCache[n]=(window.claude&&typeof window.claude.use==='function')?window.claude.use(n).catch(()=>null):Promise.resolve(null));

/* ---------- data ---------- */
const D={customers:new Map(),visits:new Map(),meta:{nextNo:1},ver:0,_idx:null,_iv:-1,_st:new Map(),_sv:-1};
const cmpVisit=(a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.start||'99')<(b.start||'99')?-1:(a.start||'99')>(b.start||'99')?1:0;
function byCustomer(){
  if(D._iv!==D.ver){const m=new Map();for(const v of D.visits.values()){let a=m.get(v.cid);if(!a)m.set(v.cid,a=[]);a.push(v)}for(const a of m.values())a.sort(cmpVisit);D._idx=m;D._iv=D.ver}
  return D._idx;
}
const visitsOf=cid=>byCustomer().get(cid)||[];
function stats(c){
  if(D._sv!==D.ver){D._st=new Map();D._sv=D.ver}
  let s=D._st.get(c.id);if(s)return s;
  const vs=visitsOf(c.id),L=c.legacy;let count=0,total=0,last='',first='';
  const useLegacy=L&&(L.last||!vs.length);
  if(useLegacy){count=+L.count||0;total=+L.total||0;last=L.last||'';first=L.first||''}
  for(const v of vs){
    if(!useLegacy||!L.last||v.date>L.last){count++;total+=+v.amount||0}
    if(!last||v.date>last)last=v.date;
    if(!first||v.date<first)first=v.date;
  }
  if(useLegacy&&!count&&(L.last||L.first))count=0;
  s={count,total,last,first,avg:count?total/count:0};D._st.set(c.id,s);return s;
}
const fmtNo=n=>n?String(n).padStart(5,'0'):'—';
function findByNo(n){n=+n;if(!n)return null;for(const c of D.customers.values())if(c.no===n)return c;return null}
/* give every customer without a number the next one, oldest customers first; numbers are never reused */
function assignNos(){
  const all=[...D.customers.values()],need=all.filter(c=>!c.no);if(!need.length)return false;
  let next=Math.max(D.meta.nextNo||1,1+all.reduce((m,c)=>Math.max(m,c.no||0),0));
  need.sort((a,b)=>{const fa=stats(a).first||'9999',fb=stats(b).first||'9999';return fa<fb?-1:fa>fb?1:((a.created||'')<(b.created||'')?-1:(a.created||'')>(b.created||'')?1:0)});
  for(const c of need){c.no=next++;if(!S.sample)Store.dirty.add(Store.cb(c.id))}
  D.meta.nextNo=next;if(!S.sample)Store.dirty.add('meta');D.ver++;return true;
}
function findByName(name){const k=nameKey(name);for(const c of D.customers.values())if(nameKey(c.name)===k)return c;return null}

/* ---------- storage ---------- */
const IDB={db:null,
  open(){return new Promise((res,rej)=>{if(!window.indexedDB)return rej(new Error('no idb'));let r;try{r=indexedDB.open('andz-crm',3)}catch(e){return rej(e)}
    const t=setTimeout(()=>rej(new Error('timeout')),10000);
    r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');if(!d.objectStoreNames.contains('photos'))d.createObjectStore('photos');
      if(!d.objectStoreNames.contains('customers'))d.createObjectStore('customers',{keyPath:'id'});if(!d.objectStoreNames.contains('visits'))d.createObjectStore('visits',{keyPath:'id'})};
    r.onblocked=()=>toast('アプリが別の画面でも開いています。ほかのタブを閉じてください');
    r.onsuccess=()=>{clearTimeout(t);const db=r.result;db.onversionchange=()=>{db.close();location.reload()};res(this.db=db)};
    r.onerror=()=>{clearTimeout(t);rej(r.error)}})},
  keys(st){return new Promise((res,rej)=>{const q=this.db.transaction(st).objectStore(st).getAllKeys();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>rej(q.error)})},
  getAll(st){return new Promise((res,rej)=>{const q=this.db.transaction(st).objectStore(st).getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>rej(q.error)})},
  get(k,st='kv'){return new Promise((res,rej)=>{const q=this.db.transaction(st).objectStore(st).get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
  set(k,v,st='kv'){return new Promise((res,rej)=>{const tx=this.db.transaction(st,'readwrite');tx.objectStore(st).put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)})},
  del(k,st='kv'){return new Promise((res,rej)=>{const tx=this.db.transaction(st,'readwrite');tx.objectStore(st).delete(k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})},
  clear(st){return new Promise((res,rej)=>{const tx=this.db.transaction(st,'readwrite');tx.objectStore(st).clear();tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})},
  count(st){return new Promise((res,rej)=>{const q=this.db.transaction(st).objectStore(st).count();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}};
/* photos: resized JPEGs kept in this device's IndexedDB, visits hold their ids */
const Photos={urls:new Map(),
  get ok(){return !!IDB.db},
  async put(blob){const id='p'+newId();await IDB.set(id,blob,'photos');return id},
  async url(id){if(this.urls.has(id))return this.urls.get(id);let b=null;try{b=await IDB.get(id,'photos')}catch(e){}if(!b)return '';const u=URL.createObjectURL(b);this.urls.set(id,u);return u},
  async del(id){try{await IDB.del(id,'photos')}catch(e){}const u=this.urls.get(id);if(u){URL.revokeObjectURL(u);this.urls.delete(id)}},
  hydrate(root){root.querySelectorAll('img[data-pid]').forEach(async img=>{const u=await Photos.url(img.dataset.pid);if(u)img.src=u;else img.closest('.ph')?.classList.add('missing')})}
};
function resizeImage(file,max=1600){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const img=new Image();
  img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(u);
    c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',.82)};
  img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('load'))};img.src=u})}
const camSvg='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 4h6l1.6 2H20a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h3.4zm3 4.5a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9zm0 2a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5z"/></svg>';
function openViewer(items,i,opts={}){
  const el=document.createElement('div');el.className='viewer';document.body.appendChild(el);
  const close=()=>{el.remove();document.removeEventListener('keydown',key)};
  const key=e=>{if(e.key==='Escape')close();if(e.key==='ArrowLeft')go(-1);if(e.key==='ArrowRight')go(1)};document.addEventListener('keydown',key);
  const go=d=>{if(!items.length)return;i=(i+d+items.length)%items.length;draw()};
  function draw(){
    if(!items.length){close();return}
    const it=items[i];
    el.innerHTML=`<div class="vtop"><button class="vx">閉じる</button><span>${i+1} / ${items.length}${it.caption?'　'+esc(it.caption):''}</span>${opts.onDelete?'<button class="vdel">削除</button>':'<span></span>'}</div>
      <div class="vimg"><img alt="写真"></div>
      ${items.length>1?'<div class="vnav"><button class="vp" aria-label="前の写真">‹</button><button class="vn" aria-label="次の写真">›</button></div>':''}`;
    Photos.url(it.id).then(u=>{const im=$('img',el);if(im&&u)im.src=u});
    $('.vx',el).onclick=close;
    if($('.vp',el)){$('.vp',el).onclick=()=>go(-1);$('.vn',el).onclick=()=>go(1)}
    const del=$('.vdel',el);if(del)del.onclick=()=>{const bar=document.createElement('div');bar.className='vconfirm';bar.innerHTML='<span>この写真を削除しますか？</span><button class="btn sm primary">削除する</button><button class="btn sm">やめる</button>';
      el.appendChild(bar);const [y,n]=bar.querySelectorAll('button');n.onclick=()=>bar.remove();y.onclick=()=>{opts.onDelete(it.id);items.splice(i,1);if(i>=items.length)i=0;draw()}};
  }
  let sx=null;el.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
  el.addEventListener('touchend',e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50)go(dx<0?1:-1);sx=null});
  draw();
}
const Store={
  mode:'loading',db:null,uid:null,dirty:new Set(),timer:null,writing:false,failed:false,onProgress:null,
  async init(){
    const [db,user]=await Promise.all([cap('db'),cap('user')]);
    if(db&&user){try{this.uid=await user.id()}catch(e){}}
    if(db&&this.uid){
      this.db=db;this.mode='db';
      try{await this.loadDb()}catch(e){console.error(e);toast('データを読み込めませんでした。ページを開き直してください')}
    }else{this.mode='local';await this.loadLocal();try{if(navigator.storage&&navigator.storage.persist)this.persisted=await navigator.storage.persist()}catch(e){}}
  },
  col(){return this.db.collection('data/users/'+this.uid)},
  async loadDb(){
    const snap=await this.col().limit(1000).get();
    D.customers.clear();D.visits.clear();
    for(const d of snap.docs){const b=d.data();if(d.id==='meta'&&b){D.meta={nextNo:+b.nextNo||1};continue}if(!b||!Array.isArray(b.items))continue;
      if(d.id.startsWith('c-'))for(const c of b.items)D.customers.set(c.id,c);
      else if(d.id.startsWith('v-'))for(const v of b.items)D.visits.set(v.id,v);}
    D.ver++;
  },
  loadOk:false,loadErr:null,persisted:null,saved:{c:new Map(),v:new Map(),meta:''},again:false,
  async loadLocal(){
    for(let i=0;i<3&&!this.loadOk;i++){
      try{if(!IDB.db)await IDB.open();await this.readAll();this.loadOk=true}
      catch(e){this.loadErr=e;console.error(e);try{IDB.db&&IDB.db.close()}catch(_){}IDB.db=null;await sleep(500*(i+1))}
    }
  },
  /* read every record from this device; older one-block saves are merged in once */
  async readAll(){
    let [C,V,M]=await Promise.all([IDB.getAll('customers'),IDB.getAll('visits'),IDB.get('meta')]);
    if(!C.length&&!V.length){
      let old=null,ls=null;try{old=await IDB.get('data')}catch(e){}try{ls=JSON.parse(localStorage.getItem('andz-crm')||'null')}catch(e){}
      if((old&&(old.c||[]).length)||(ls&&(ls.c||[]).length)){
        const mc=new Map(),mv=new Map();
        for(const src of [old,ls])if(src){(src.c||[]).forEach(c=>mc.set(c.id,c));(src.v||[]).forEach(v=>mv.set(v.id,v))}
        C=[...mc.values()];V=[...mv.values()];
        M={nextNo:Math.max(+(old&&old.meta&&old.meta.nextNo)||1,+(ls&&ls.meta&&ls.meta.nextNo)||1)};
        await this.txn(tx=>{const cs=tx.objectStore('customers'),vs=tx.objectStore('visits');C.forEach(c=>cs.put(c));V.forEach(v=>vs.put(v));tx.objectStore('kv').put(M,'meta')});
        this.migrated=true;
      }
    }
    D.customers.clear();D.visits.clear();C.forEach(c=>D.customers.set(c.id,c));V.forEach(v=>D.visits.set(v.id,v));
    D.meta=M?{nextNo:+M.nextNo||1}:{nextNo:1};
    try{const T=await IDB.get('tomb');this.tomb=new Map((T||[]).map(t=>[t.id,t]));const CD=await IDB.get('cloudDirty');Cloud.dirty=new Set(CD||[])}catch(e){}
    for(const id of [...this.tomb.keys()])if(D.customers.has(id)||D.visits.has(id))this.tomb.delete(id);
    this.savedU=new Map([...C,...V].map(r=>[r.id,r.u||0]));
    this.saved={c:new Map(C.map(c=>[c.id,JSON.stringify(c)])),v:new Map(V.map(v=>[v.id,JSON.stringify(v)])),meta:JSON.stringify(D.meta)};
    D.ver++;
  },
  txn(fn){return new Promise((res,rej)=>{const tx=IDB.db.transaction(['customers','visits','kv'],'readwrite');fn(tx);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error||new Error('abort'))})},
  /* write only what changed since the last save, in one transaction */
  tomb:new Map(),
  /* write only what changed since the last save, in one transaction.
     stamp=true: a change made on this device -> time-stamp it and queue it for the cloud.
     stamp=false: the change came from the cloud -> store it as-is. */
  async saveLocal(stamp=true,fast=false){
    if(!this.loadOk||!IDB.db)throw new Error('not loaded');
    const nc=new Map(),nv=new Map();let n=0;const mj=JSON.stringify(D.meta);const now=Date.now();const cd=Cloud.dirty;const tomb=this.tomb;
    for(const c of D.customers.values()){let j=JSON.stringify(c);if(this.saved.c.get(c.id)!==j&&stamp){c.u=now;j=JSON.stringify(c);cd.add(this.cb(c.id))}nc.set(c.id,j)}
    for(const id of this.saved.c.keys())if(!nc.has(id)&&stamp&&!tomb.has(id)){tomb.set(id,{id,del:1,u:now,b:this.cb(id)});cd.add(this.cb(id))}
    for(const v of D.visits.values()){let j=JSON.stringify(v);const old=this.saved.v.get(v.id);
      if(old!==j&&stamp){v.u=now;j=JSON.stringify(v);cd.add(this.vb(v));if(old){try{const ov=JSON.parse(old);if(ov.date&&this.vb(ov)!==this.vb(v))cd.add(this.vb(ov))}catch(e){}}}
      nv.set(v.id,j)}
    for(const [id,old] of this.saved.v)if(!nv.has(id)&&stamp&&!tomb.has(id)){let b='';try{b=this.vb(JSON.parse(old))}catch(e){}if(b){tomb.set(id,{id,del:1,u:now,b});cd.add(b)}}
    for(const id of [...tomb.keys()])if(nc.has(id)||nv.has(id))tomb.delete(id);
    if(mj!==this.saved.meta&&stamp)cd.add('meta');
    const cut=now-180*864e5;for(const [id,t] of tomb)if(t.u<cut)tomb.delete(id);
    /* before writing a record, check the stored copy: if another screen saved a newer version
       since this screen loaded it, do not overwrite it -> reload the latest instead */
    const conflicts=new Set();const su=this.savedU||new Map();
    await this.txn(tx=>{const cs=tx.objectStore('customers'),vs=tx.objectStore('visits'),kv=tx.objectStore('kv');
      const chk=(st,id,act)=>{if(!stamp||fast){act();return}const q=st.get(id);q.onsuccess=()=>{const cur=q.result;if(cur&&(cur.u||0)>(su.get(id)||0)){conflicts.add(id);return}act()}};
      for(const c of D.customers.values())if(this.saved.c.get(c.id)!==nc.get(c.id)){chk(cs,c.id,()=>cs.put(c));n++}
      for(const id of this.saved.c.keys())if(!nc.has(id)){chk(cs,id,()=>cs.delete(id));n++}
      for(const v of D.visits.values())if(this.saved.v.get(v.id)!==nv.get(v.id)){chk(vs,v.id,()=>vs.put(v));n++}
      for(const id of this.saved.v.keys())if(!nv.has(id)){chk(vs,id,()=>vs.delete(id));n++}
      if(mj!==this.saved.meta)kv.put(D.meta,'meta');
      kv.put([...tomb.values()],'tomb');kv.put([...cd],'cloudDirty');
    });
    this.saved={c:nc,v:nv,meta:mj};
    for(const c of D.customers.values())su.set(c.id,c.u||0);for(const v of D.visits.values())su.set(v.id,v.u||0);this.savedU=su;
    if(conflicts.size){await this.readAll();refreshUI();toast('別の画面で新しく保存された内容があったため、最新の状態に切り替えました')}
    try{localStorage.setItem('andz-count',String(D.customers.size+D.visits.size));localStorage.removeItem('andz-crm')}catch(e){}
    if(n){if(Sync.ch)try{Sync.ch.postMessage('saved')}catch(e){}else try{localStorage.setItem('andz-ping',String(Date.now()))}catch(e){}}
    if(stamp&&cd.size)Cloud.schedulePush();
  },
  async clearLocal(){
    D.customers.clear();D.visits.clear();D.meta={nextNo:1};D.ver++;this.tomb=new Map();Cloud.dirty=new Set();
    await this.txn(tx=>{tx.objectStore('customers').clear();tx.objectStore('visits').clear();const kv=tx.objectStore('kv');['data','meta','tomb','cloudDirty'].forEach(k=>kv.delete(k))});
    this.saved={c:new Map(),v:new Map(),meta:JSON.stringify(D.meta)};try{localStorage.setItem('andz-count','0')}catch(e){}
  },
  get pending(){return !!this.timer||this.writing||this.dirty.size>0},
  flushNow(){if(this.timer){clearTimeout(this.timer);this.timer=null}return this.flush()},
  cb(id){return 'c-'+pad(hash(id)%32)},
  vb(v){return 'v-'+v.date.slice(0,7)+'-'+(+v.date.slice(8,10)<=15?1:2)},
  touchC(c){D.ver++;if(S.sample)return;this.dirty.add(this.cb(c.id));this.schedule()},
  touchV(v){D.ver++;if(S.sample)return;if(v&&v.date)this.dirty.add(this.vb(v));this.schedule()},
  schedule(){clearTimeout(this.timer);this.failed=false;setSave('saving');this.timer=setTimeout(()=>{this.timer=null;this.flush()},this.mode==='db'?500:0)},
  async flush(){
    if(this.writing){this.again=true;return}this.writing=true;this.again=false;
    try{
      if(this.mode!=='db'){if(S.sample){this.dirty.clear()}else{this.dirty.clear();await this.saveLocal()}}
      else{while(this.dirty.size){const id=this.dirty.values().next().value;this.dirty.delete(id);
        try{await this.writeBucket(id)}catch(e){this.dirty.add(id);throw e}
        if(this.onProgress)this.onProgress(this.dirty.size)}}
      setSave('saved');
    }catch(e){this.failed=true;setSave('error');if(this.mode!=='db'){this.dirty.add('retry');toast('保存できませんでした。もう一度操作するか、アプリを開き直してください')}else toast(dbMsg(e))}
    finally{this.writing=false;if((this.again||this.dirty.size)&&!this.failed)this.flush()}
  },
  items(id){return id.startsWith('c-')?[...D.customers.values()].filter(c=>this.cb(c.id)===id):[...D.visits.values()].filter(v=>this.vb(v)===id)},
  async writeBucket(id){
    const items=id==='meta'?null:this.items(id),ref=this.col().doc(id);
    for(let i=0;;i++){
      try{if(!items){await ref.set({nextNo:D.meta.nextNo});return}if(items.length)await ref.set({items});else await ref.delete();return}
      catch(e){const c=e&&e.code;if((c==='resource_exhausted'||c==='unavailable')&&i<6){await sleep(800*(i+1)+Math.random()*600);continue}throw e}
    }
  },
  async wipe(){
    D.customers.clear();D.visits.clear();D.meta={nextNo:1};D.ver++;
    if(this.mode==='db'){const snap=await this.col().limit(1000).get();for(const d of snap.docs){await this.col().doc(d.id).delete()}}
    else{try{localStorage.removeItem('andz-crm')}catch(e){}await this.saveLocal(true);try{await IDB.clear('photos')}catch(e){}}
  }
};
function dbMsg(e){const c=e&&e.code;
  if(c==='quota_exceeded')return '保存できる容量の上限に達しました';
  if(c==='revoked'||c==='not_granted')return 'このページでは保存できません。開き直してください';
  return '保存に失敗しました。通信状態を確認して、もう一度操作してください';}
function setSave(s){const el=$('#savechip');if(s==='saving'){el.textContent='保存中…';el.hidden=false}else if(s==='error'){el.textContent='未保存あり';el.hidden=false}else{el.textContent='保存しました ✓';el.hidden=false;setTimeout(()=>{if(el.textContent==='保存しました ✓')el.hidden=true},1500)}}

Store.leaveSave=()=>{if(Store.mode!=='local'||!Store.loadOk||S.sample)return;if(Store.timer){clearTimeout(Store.timer);Store.timer=null}if(Store.pending||Store.writing)Store.saveLocal(true,true).catch(()=>{})};

/* ---------- chart ---------- */
function niceStep(r){const p=Math.pow(10,Math.floor(Math.log10(r||1)));const f=r/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p}
function lineChart(vals,{xl,yf,label}){
  const W=360,H=190,L=50,R=12,T=10,B=24,iw=W-L-R,ih=H-T-B,n=vals.length;
  const nums=vals.filter(v=>v!=null);const mx=Math.max(1,...nums);const step=niceStep(mx/4);const top=Math.ceil(mx/step)*step;
  const X=i=>L+(n>1?i*iw/(n-1):iw/2),Y=v=>T+ih-v/top*ih;
  let g='';for(let v=0;v<=top+1e-9;v+=step){g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${Y(v)+3.5}" text-anchor="end" font-size="10" fill="var(--muted)">${yf(v)}</text>`}
  vals.forEach((v,i)=>{const t=xl(i);if(t)g+=`<line x1="${X(i)}" x2="${X(i)}" y1="${T}" y2="${T+ih}" stroke="var(--line)" stroke-dasharray="2 3"/><text x="${X(i)}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--muted)">${t}</text>`});
  const pts=vals.map((v,i)=>v==null?null:[X(i),Y(v)]).filter(Boolean);
  let p='';if(pts.length){const d=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
    p=`<path d="${d} L${pts[pts.length-1][0]} ${T+ih} L${pts[0][0]} ${T+ih}Z" fill="var(--accent)" fill-opacity=".14"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>`+
      pts.map((q,i)=>`<circle cx="${q[0]}" cy="${q[1]}" r="${i===pts.length-1?4:2.3}" fill="var(--accent)"/>`).join('')}
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${g}<line x1="${L}" x2="${L}" y1="${T}" y2="${T+ih}" stroke="var(--muted)"/>${p}</svg><div class="legend"><i></i>${esc(label)}</div></div>`;
}
const yMan=v=>v>=10000?(v/10000).toLocaleString('ja-JP',{maximumFractionDigits:1})+'万':v.toLocaleString('ja-JP');

function filteredCustomers(){
  const q=nameKey(S.q);let a=[...D.customers.values()];

    body.querySelectorAll('.quick button').forEach(b=>b.onclick=()=>{v.dur=+b.dataset.q;const st=toMin($('#vf-start',body).value);if(st!=null)$('#vf-end',body).value=toT(st+v.dur);showDur()});
    const am=$('#vf-amount',body);am.onfocus=()=>{am.value=am.value.replace(/,/g,'')};am.onblur=()=>{if(am.value!=='')am.value=pNum(am.value).toLocaleString('ja-JP')};

        for(const f of files){try{const id=await Photos.put(await resizeImage(f));photos.push(id);added.push(id)}catch(err){ng++}}

        const exact=m.some(c=>nameKey(c.name)===q);

  if(kind==='close')customerList('親密度が高い順',()=>all().filter(c=>stats(c).count).sort((a,b)=>stats(b).count-stats(a).count||(stats(b).last>stats(a).last?1:-1)).slice(0,100),c=>`<span class="c">最終 ${fmtD(stats(c).last)}</span><span class="v">${stats(c).count}回</span>`,'来店回数の多い順（上位100名）');
  else if(kind==='money')customerList('お金が高い順',()=>all().filter(c=>stats(c).total).sort((a,b)=>stats(b).total-stats(a).total).slice(0,100),c=>`<span class="c">${stats(c).count}回</span><span class="v">${yen(stats(c).total)}</span>`,'合計金額の多い順（上位100名）');
  else if(kind==='lapsed')customerList('未来店リスト',()=>all().filter(c=>stats(c).last&&daysSince(stats(c).last)>=30).sort((a,b)=>stats(a).last<stats(b).last?1:-1),c=>`<span class="c">${fmtD(stats(c).last)}</span><span class="v">${daysSince(stats(c).last)}日</span>`,'最後の来店から30日以上たったお客様（最近来た順）');
  else{
    openSheet(kind==='wdgood'?'来店しやすい曜日':'来店しにくい曜日',(body)=>{
      const cnt=Array(7).fill(0),amt=Array(7).fill(0);for(const v of D.visits.values()){const d=parseD(v.date).getDay();cnt[d]++;amt[d]+=+v.amount||0}

      body.innerHTML=`<p class="hint">これまでの全来店記録（${D.visits.size}件）を曜日ごとに数えています。</p><div class="bars">${order.map(d=>`<div class="bar"><span class="lab ${d===0?'sun':''}" style="${d===0?'color:var(--sun)':d===6?'color:var(--sat)':''}">${WD[d]}</span><span class="t"><i style="width:${cnt[d]/mx*100}%"></i></span><span class="val">${cnt[d]}件・平均${yen(cnt[d]?amt[d]/cnt[d]:0)}</span></div>`).join('')}</div>`;
    },{live:true});
  }
}

      ${Store.mode==='local'?'<button class="btn" id="st-hist">前の状態に戻す（自動の履歴）</button>':''}
      <button class="btn" id="st-lock">パスコードロック${Lock.rec?"（オン）":"（オフ）"}</button>
      <div style="margin-top:12px"><button class="btn danger" id="st-wipe">すべてのデータを削除</button></div>`;

function toCSV(rows){return '﻿'+rows.map(r=>r.map(x=>{x=String(x??'');return /[",\n\r]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x}).join(',')).join('\r\n')}
const stamp=()=>todayStr().replace(/-/g,'');
function exportCustomers(){
  const rows=[['顧客番号','名前','ふりがな','ニックネーム','電話番号','メール','誕生日','性別','住所','メモ','初回来店日','最終来店日','来店回数','合計金額']];
  for(const c of [...D.customers.values()].sort((a,b)=>(a.no||0)-(b.no||0))){const s=stats(c);rows.push([fmtNo(c.no),c.name,c.kana,c.nick,c.phone,c.email,c.birthday?(c.birthday.startsWith('0000')?c.birthday.slice(5).replace('-','/'):fmtD(c.birthday)):'',c.gender,c.address,c.memo,fmtD(s.first),fmtD(s.last),s.count,s.total])}
  saveFile(`顧客一覧_${stamp()}.csv`,toCSV(rows));
}
function exportVisits(){
  const rows=[['顧客番号','名前','来店日','開始時刻','滞在時間(分)','金額','評価','カテゴリ','メモ']];
  for(const v of [...D.visits.values()].sort(cmpVisit))rows.push([fmtNo((D.customers.get(v.cid)||{}).no),cname(v.cid),fmtD(v.date),v.start,v.dur,v.amount,v.rating,v.cat,v.memo]);
  saveFile(`来店履歴_${stamp()}.csv`,toCSV(rows));
}
async function saveFile(name,data){
  const dl=await cap('downloads');
  if(dl){try{await dl.save({filename:name,data});toast('書き出しました');return}catch(e){if(e&&(e.code==='declined'))return;if(e&&e.code==='rate_limited'){toast('少し待ってからもう一度押してください');return}}}
  if(!window.claude){
    try{const f=new File([data],name,{type:'text/csv'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});markBackup();return}}catch(e){if(e&&e.name==='AbortError')return}
    try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/csv'}));a.download=name;document.body.appendChild(a);a.click();a.remove();markBackup();toast('書き出しました');return}catch(e){}}
  openSheet(name,(body)=>{body.innerHTML=`<p class="hint">この画面ではファイルを保存できないため、内容を表示しています。全部コピーして、メモ帳などに貼り付けて「.csv」で保存してください。</p><textarea class="out" readonly>${esc(data.replace(/^﻿/,''))}</textarea><button class="btn primary" id="cp">全部コピー</button>`;
    $('#cp',body).onclick=()=>{const t=$('textarea',body);t.select();try{navigator.clipboard.writeText(t.value).then(()=>toast('コピーしました'),()=>toast('選択した状態です。コピーしてください'))}catch(e){}}});
}

/* ---------- CSV import ---------- */
function parseCSV(text){
  text=text.replace(/^﻿/,'');const first=text.split(/\r?\n/,1)[0]||'';
  const delim=first.split('\t').length>first.split(',').length?'\t':',';
  const rows=[];let row=[],f='',q=false;

function runImport(st){

  const idx=new Map();for(const c of D.customers.values())idx.set(nameKey(c.name),c);

      const memo=String(get(r,'memo')).trim();if(memo&&!(c.memo||'').includes(memo))c.memo=c.memo?c.memo+'\n'+memo:memo;
      const b=pBirthday(get(r,'birthday'));if(b)c.birthday=b;
      const L={...(c.legacy||{})};let has=false;
      if(col('first')>=0){const v=pDate(get(r,'first'));if(v){L.first=v;has=true}}
      if(col('last')>=0){const v=pDate(get(r,'last'));if(v){L.last=v;has=true}}
      if(col('count')>=0&&norm(get(r,'count'))!==''){L.count=pNum(get(r,'count'));has=true}
      if(col('total')>=0&&norm(get(r,'total'))!==''){L.total=pNum(get(r,'total'));has=true}
      if(has)c.legacy=L;
      Store.dirty.add(Store.cb(c.id));
    }
  }else{
    const keys=new Set([...D.visits.values()].map(v=>`${v.cid}|${v.date}|${v.start||''}|${v.amount}`));
    const dateCol=col('date');
    for(const r of rows){const date=pDate(get(r,'date'))||pDate(get(r,'start'));const name=norm(get(r,'name'))||(date?'（名前なし）':'');if(!name||!date){res.skip++;continue}

      const v={id:newId()+res.newV,cid:c.id,date,start,dur:col('dur')>=0?pDur(get(r,'dur')):(col('end')>=0&&start&&pTime(get(r,'end'))?((t=>{const [a,b]=start.split(':').map(Number),[c,d]=t.split(':').map(Number);return ((c*60+d)-(a*60+b)+1440)%1440})(pTime(get(r,'end')))):60),amount:pNum(get(r,'amount')),rating:Math.max(0,Math.min(5,Math.round(pNum(get(r,'rating'))))),cat:norm(get(r,'cat')),memo:String(get(r,'memo')).trim()};

        <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join('')}<span></span><button data-k="0">0</button><button data-k="del" class="sm">削除</button></div>`;
      body.querySelector('.pad').onclick=async e=>{const b=e.target.closest('button');if(!b)return;const k=b.dataset.k;
        if(k==='del'){pin=pin.slice(0,-1);draw();return}
        pin+=k;if(pin.length<4){draw();return}
        if(step===1){first=pin;pin='';step=2;draw();return}
        if(pin!==first){pin='';step=1;draw();$('#lk-err',body).textContent='2回の入力が一致しませんでした。最初からもう一度入力してください';return}
        await Lock.set(pin);Lock.rec.len=4;await Lock.store(Lock.rec);toast('パスコードを設定しました');s.close()};
    };draw();
  });
}

/* ---------- cloud sync (Firebase, optional) ----------
   The phone keeps its own copy (fast, works offline). When signed in, every change is also
   sent to the user's own area in Firestore: users/{uid}/b/{bucket}. Records carry u (last change time);
   on merge the newer one wins, and deletions travel as tombstones {id,del,u,b}. */
const FIREBASE_CONFIG=window.ANDZ_FIREBASE||null;
const FB_VER='10.14.1';
function loadScript(src){return new Promise((res,rej)=>{const e=document.createElement('script');e.src=src;e.onload=res;e.onerror=()=>rej(new Error('load '+src));document.head.appendChild(e)})}
const Cloud={ready:false,user:null,fs:null,auth:null,dirty:new Set(),busy:false,timer:null,state:'off',lastSync:0,
  get enabled(){return !!FIREBASE_CONFIG},
  async init(){
    if(!FIREBASE_CONFIG)return;
    try{if(!window.firebase||!firebase.firestore){for(const f of ['app','auth','firestore'])await loadScript(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-${f}-compat.js`)}
      if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
      this.auth=firebase.auth();this.fs=firebase.firestore();
      this.user=await new Promise(res=>{const un=this.auth.onAuthStateChanged(u=>{un();res(u)})});
      this.ready=true;
    }catch(e){console.error(e);this.setState('offline')}
  },
  setState(st){this.state=st;const el=$('#cloudchip');if(!el)return;
    const t={off:'',offline:'オフライン（あとで送ります）',syncing:'クラウドと同期中…',ok:'',error:'クラウドに送れていません',signedout:'クラウド未ログイン'}[st]||'';
    el.textContent=t;el.hidden=!t;el.className=st==='error'||st==='signedout'?'warn':''},
  col(){return this.fs.collection('users').doc(this.user.uid).collection('b')},
  bucketItems(id){const out=[];
    if(id.startsWith('c-')){for(const c of D.customers.values())if(Store.cb(c.id)===id)out.push(c)}
    else for(const v of D.visits.values())if(Store.vb(v)===id)out.push(v);
    for(const t of Store.tomb.values())if(t.b===id)out.push(t);
    return out.map(r=>JSON.parse(JSON.stringify(r)))},
  localOf(id){return D.customers.get(id)||D.visits.get(id)||Store.tomb.get(id)||null},
  /* apply one record from the cloud if it is newer than ours; returns true if something changed */
  applyRemote(r,bucket){
    const loc=this.localOf(r.id);if(loc&&(loc.u||0)>=(r.u||0))return false;
    const isC=bucket.startsWith('c-');const map=isC?D.customers:D.visits;
    if(r.del){D.customers.delete(r.id);D.visits.delete(r.id);Store.tomb.set(r.id,{id:r.id,del:1,u:r.u||0,b:r.b||bucket})}
    else{const o={...r};map.set(r.id,o);Store.tomb.delete(r.id)}
    return true},
  /* full two-way sync: read every bucket, take what is newer, send what we have newer */
  async sync(){
    if(!this.ready||!this.user||this.busy||!Store.loadOk||S.sample)return;
    this.busy=true;this.setState('syncing');
    try{
      if(Store.pending)await Store.flushNow();
      const snap=await this.col().get();
      const remote=new Map();let rnext=1;
      snap.forEach(d=>{const b=d.data()||{};if(d.id==='meta'){rnext=+b.nextNo||1;return}
        for(const r of b.items||[]){const o=remote.get(r.id);if(!o||(r.u||0)>(o.r.u||0))remote.set(r.id,{r,b:d.id})}});
      let changed=false;
      for(const {r,b} of remote.values())if(this.applyRemote(r,b))changed=true;
      for(const c of D.customers.values()){const x=remote.get(c.id);if(!x||(c.u||0)>(x.r.u||0))this.dirty.add(Store.cb(c.id))}
      for(const v of D.visits.values()){const x=remote.get(v.id);if(!x||(v.u||0)>(x.r.u||0))this.dirty.add(Store.vb(v))}
      for(const t of Store.tomb.values()){const x=remote.get(t.id);if(x&&(t.u||0)>(x.r.u||0))this.dirty.add(t.b)}
      if(rnext>(D.meta.nextNo||1)){D.meta.nextNo=rnext;changed=true}else if((D.meta.nextNo||1)>rnext)this.dirty.add('meta');
      if(changed){if(fixDupNos())changed=true;D.ver++;await Store.saveLocal(false);refreshUI()}
      await this.push(snap.empty);
      this.lastSync=Date.now();this.setState(this.dirty.size?'error':'ok');
    }catch(e){console.error(e);this.setState(navigator.onLine===false?'offline':'error')}
    finally{this.busy=false;try{await IDB.set('cloudDirty',[...this.dirty])}catch(e){}}
  },
  schedulePush(){if(!this.ready||!this.user)return;clearTimeout(this.timer);this.timer=setTimeout(()=>this.push(false),1500)},
  /* send the buckets we changed. Each one is merged with what is in the cloud inside a transaction,
     so a change made on another phone in the meantime is kept, not overwritten. */
  async push(firstUpload){
    if(!this.ready||!this.user||this.pushing)return;
    if(!this.dirty.size)return;
    this.pushing=true;let gotRemote=false;
    try{
      const ids=[...this.dirty];
      if(firstUpload){
        for(let i=0;i<ids.length;i+=50){const batch=this.fs.batch();
          for(const id of ids.slice(i,i+50))batch.set(this.col().doc(id),id==='meta'?{nextNo:D.meta.nextNo||1}:{items:this.bucketItems(id)});
          await batch.commit();ids.slice(i,i+50).forEach(id=>this.dirty.delete(id))}
      }else{
        const one=async id=>{
          const ref=this.col().doc(id);
          await this.fs.runTransaction(async tx=>{
            const d=await tx.get(ref);const cur=d.exists?(d.data()||{}):{};
            if(id==='meta'){const n=Math.max(+cur.nextNo||1,D.meta.nextNo||1);if(n>(D.meta.nextNo||1)){D.meta.nextNo=n;gotRemote=true}tx.set(ref,{nextNo:n});return}
            const mine=new Map(this.bucketItems(id).map(r=>[r.id,r]));
            for(const r of cur.items||[]){const m=mine.get(r.id);
              if(m){if((r.u||0)>(m.u||0)){mine.set(r.id,r);if(this.applyRemote(r,id))gotRemote=true}continue}
              const loc=this.localOf(r.id);
              if(!loc||(r.u||0)>(loc.u||0)){mine.set(r.id,r);if(this.applyRemote(r,id))gotRemote=true}}
            tx.set(ref,{items:[...mine.values()]});
          });
          this.dirty.delete(id);
        };
        for(let i=0;i<ids.length;i+=4)await Promise.all(ids.slice(i,i+4).map(one));
      }
      if(gotRemote){fixDupNos();D.ver++;await Store.saveLocal(false);refreshUI()}
      this.setState('ok');
    }catch(e){console.error(e);this.setState(navigator.onLine===false?'offline':'error')}
    finally{this.pushing=false;try{await IDB.set('cloudDirty',[...this.dirty])}catch(e){}}
  },
  async signIn(email,pw){await this.auth.signInWithEmailAndPassword(email,pw);this.user=this.auth.currentUser},
  async signOut(){await this.auth.signOut();this.user=null}
};
/* two phones may hand out the same customer number at the same time; give the later one a new number */
function fixDupNos(){const seen=new Map();let ch=false;
  for(const c of [...D.customers.values()].sort((a,b)=>(a.u||0)-(b.u||0))){if(!c.no)continue;if(seen.has(c.no)){c.no=D.meta.nextNo++;c.u=Date.now();Cloud.dirty.add(Store.cb(c.id));Cloud.dirty.add('meta');ch=true}else seen.set(c.no,c)}
  return ch}
function fbMsg(e){const c=(e&&e.code)||'';
  if(/wrong-password|invalid-credential|invalid-login|user-not-found/.test(c))return 'メールアドレスかパスワードがちがいます';
  if(/invalid-email/.test(c))return 'メールアドレスの形がちがいます';
  if(/too-many-requests/.test(c))return '何度もまちがえたため、しばらく待ってからもう一度お試しください';
  if(/network/.test(c))return 'インターネットにつながっていません。電波のよい場所でもう一度お試しください';
  return 'ログインできませんでした（'+c+'）'}
/* sign-in screen; resolves when signed in. Account switching on one phone clears the old account's copy first. */
function showLogin(){return new Promise(done=>{
  $('#app').hidden=true;const el=document.createElement('div');el.className='lock';
  el.innerHTML=`<form class="lk-in login" autocomplete="on"><div class="lk-icon"><img src="apple-touch-icon.png" alt="" onerror="this.remove()"></div><h2>ログイン</h2>
    <p class="hint" style="text-align:center">お客様のデータは、あなた専用のクラウドの場所に自動で保存されます。スマホを替えても、同じメールアドレスでログインすれば元どおりです。</p>
    <label class="field"><span>メールアドレス</span><input id="lg-mail" type="email" autocomplete="username" required></label>
    <label class="field"><span>パスワード</span><input id="lg-pw" type="password" autocomplete="current-password" required></label>
    <p class="lk-msg" id="lg-msg"></p>
    <button class="btn primary" style="width:100%" id="lg-go">ログイン</button>
    <button type="button" class="btn sm" id="lg-forgot">パスワードを忘れた</button></form>`;
  document.body.appendChild(el);
  const msg=$('#lg-msg',el);
  $('form',el).addEventListener('submit',async e=>{e.preventDefault();const btn=$('#lg-go',el);btn.disabled=true;msg.textContent='ログインしています…';
    try{await Cloud.signIn($('#lg-mail',el).value.trim(),$('#lg-pw',el).value);el.remove();$('#app').hidden=false;done()}
    catch(err){msg.textContent=fbMsg(err);btn.disabled=false}});
  $('#lg-forgot',el).onclick=async()=>{const m=$('#lg-mail',el).value.trim();if(!m){msg.textContent='先にメールアドレスを入力してください';return}
    try{await Cloud.auth.sendPasswordResetEmail(m);msg.textContent='パスワードを設定し直すメールを送りました。メールを確認してください'}catch(err){msg.textContent=fbMsg(err)}};
})}
/* after sign-in: decide what to do with data already on this phone */
async function adoptAccount(){
  let owner=null;try{owner=await IDB.get('owner')}catch(e){}
  const uid=Cloud.user.uid;
  if(owner&&owner!==uid){await Store.clearLocal()}
  else if(!owner&&(D.customers.size||D.visits.size)){
    let cloudHas=false;try{const q=await Cloud.col().limit(1).get();cloudHas=!q.empty}catch(e){}
    if(cloudHas){const keep=await askChoice('この端末のデータをどうしますか？',`このスマホにはお客様${D.customers.size}人・来店${D.visits.size}件のデータがあり、クラウドにも別のデータがあります。`,[['cloud','クラウドのデータを使う（おすすめ）','このスマホの分は消して、クラウドの内容に置きかえます。'],['merge','両方を合わせる','同じお客様が2人ずつになることがあります。']]);
      if(keep==='cloud')await Store.clearLocal()}
    else{for(const c of D.customers.values())Cloud.dirty.add(Store.cb(c.id));for(const v of D.visits.values())Cloud.dirty.add(Store.vb(v));Cloud.dirty.add('meta')}
  }
  try{await IDB.set('owner',uid)}catch(e){}
}
function askChoice(title,text,opts){return new Promise(done=>{const el=document.createElement('div');el.className='lock';
  el.innerHTML=`<div class="lk-in" style="max-width:380px"><h2>${esc(title)}</h2><p class="hint">${esc(text)}</p>${opts.map(([k,l,d])=>`<button class="btn ${k===opts[0][0]?'primary':''}" data-k="${k}" style="width:100%;flex-direction:column;align-items:flex-start"><span>${esc(l)}</span><small style="font-weight:400;opacity:.8">${esc(d)}</small></button>`).join('')}</div>`;
  document.body.appendChild(el);el.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{el.remove();done(b.dataset.k)})})}

/* ---------- automatic history: one copy per day (kept 7 days) ---------- */
const Hist={
  async index(){try{return (await IDB.get('snapindex'))||[]}catch(e){return []}},
  async save(label){const ix=await this.index();const k='snap-'+Date.now();
    await IDB.set(k,{c:[...D.customers.values()],v:[...D.visits.values()],meta:{...D.meta}});
    ix.push({k,t:Date.now(),day:todayStr(),c:D.customers.size,v:D.visits.size,label:label||''});
    const keep=ix.filter(x=>x.label).slice(-3).concat(ix.filter(x=>!x.label).slice(-7)).sort((a,b)=>a.t-b.t);
    for(const x of ix)if(!keep.includes(x))try{await IDB.del(x.k)}catch(e){}
    await IDB.set('snapindex',keep)},
  async daily(){if(Store.mode!=='local'||!Store.loadOk||S.sample||(!D.customers.size&&!D.visits.size))return;
    try{const ix=await this.index();if(!ix.some(x=>x.day===todayStr()&&!x.label))await this.save('')}catch(e){console.error(e)}},
  async restore(x){const snap=await IDB.get(x.k);if(!snap)throw new Error('none');
    await this.save('戻す前の状態');
    const next=Math.max(D.meta.nextNo||1,(snap.meta&&snap.meta.nextNo)||1);
    D.customers.clear();D.visits.clear();snap.c.forEach(c=>D.customers.set(c.id,{...c}));snap.v.forEach(v=>D.visits.set(v.id,{...v}));D.meta={nextNo:next};D.ver++;
    await Store.saveLocal(true);refreshUI()}
};
function openHistory(){
  openSheet('前の状態に戻す',async(body,s)=>{
    const ix=(await Hist.index()).slice().reverse();
    body.innerHTML=`<p class="hint">毎日、その日に最初に開いたときの状態を自動で残しています（7日分）。まちがえて消したときなどに、その時点の状態に戻せます。戻す直前の状態も残るので、やり直しもできます。</p>
      ${ix.length?ix.map((x,i)=>`<div class="hrow" style="cursor:default"><span class="d">${new Date(x.t).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</span><span class="s">${esc(x.label||'その日の最初')}</span><span><button class="btn sm" data-i="${i}">この状態に戻す</button></span><span class="m">お客様${x.c}人・来店${x.v}件</span></div>`).join(''):'<p class="muted">まだ記録がありません。明日以降、自動で残ります。</p>'}`;
    body.querySelectorAll('[data-i]').forEach(b=>b.onclick=e=>{const x=ix[+b.dataset.i];inlineConfirm(e.currentTarget,`${new Date(x.t).toLocaleString('ja-JP')} の状態（お客様${x.c}人・来店${x.v}件）に戻します。今の状態も履歴に残ります。`,'戻す',async()=>{
      try{await Hist.restore(x);toast('前の状態に戻しました');s.close()}catch(err){toast('戻せませんでした')}})});
  });
}

function showFatal(){
  $('#app').hidden=true;const el=document.createElement('div');el.className='lock';
  el.innerHTML=`<div class="lk-in" style="max-width:360px"><h2>データを読み込めませんでした</h2><p class="hint" style="text-align:center">この端末の保存場所を開けませんでした。データを守るため、このまま入力はできないようにしています。<br>アプリを完全に閉じてから、もう一度開いてください。</p><button class="btn primary" onclick="location.reload()">もう一度読み込む</button><p class="hint" style="text-align:center;font-size:11px">${esc(String(Store.loadErr&&(Store.loadErr.name||Store.loadErr.message)||''))}</p></div>`;
  document.body.appendChild(el);
}

(async()=>{
  await Store.init();
  if(await Lock.load())await Lock.show();
  if(Store.mode==='local'&&!Store.loadOk){showFatal();return}
  if(Store.mode==='local'&&Cloud.enabled){
    await Cloud.init();
    if(Cloud.ready&&!Cloud.user)await showLogin();
    if(Cloud.ready&&Cloud.user){await adoptAccount();Cloud.sync()}
  }
  if(assignNos())Store.schedule();
  let had=0;try{had=+(localStorage.getItem('andz-count')||0)}catch(e){}
  if(Store.mode==='local'&&!D.customers.size&&!D.visits.size&&had>0)S.missing=true;
  S.ready=true;render();
  Hist.daily();
  if(Store.migrated)toast('データを新しい保存方式に移しました');
})();
</script>

<script>if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}</script>
